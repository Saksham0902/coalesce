<template>
    <lightning-card title="Coalesce — Duplicate Contact Report" icon-name="standard:merge">
        <div class="slds-var-p-horizontal_medium">
            <div class="slds-grid slds-grid_vertical-align-end slds-gutters_x-small slds-var-m-bottom_small">
                <div class="slds-col slds-size_2-of-3">
                    <lightning-input
                        type="number"
                        label="Contacts to scan"
                        value={effectiveLimit}
                        min="2"
                        max="200"
                        message-when-range-overflow="All-pairs comparison is quadratic; 200 is the ceiling."
                        onchange={handleLimitChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-button
                        variant="brand"
                        label={scanLabel}
                        disabled={running}
                        onclick={handleScan}
                        class="slds-var-m-bottom_xx-small"
                    ></lightning-button>
                </div>
            </div>

            <template lwc:if={running}>
                <div class="slds-is-relative slds-var-p-vertical_medium">
                    <lightning-spinner alternative-text="Comparing every pair" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={error}>
                <div class="slds-text-color_error slds-var-p-vertical_small">{error}</div>
            </template>

            <template lwc:if={hasRun}>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_small">
                    <div class="slds-col slds-size_1-of-3 slds-var-m-bottom_x-small">
                        <div class="slds-text-title_caps slds-text-color_weak">Scanned</div>
                        <div class="slds-text-heading_medium">{view.contactsScanned}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-var-m-bottom_x-small">
                        <div class="slds-text-title_caps slds-text-color_weak">Pairs compared</div>
                        <div class="slds-text-heading_medium">{view.pairsCompared}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-var-m-bottom_x-small">
                        <div class="slds-text-title_caps slds-text-color_weak">Clusters</div>
                        <div class="slds-text-heading_medium">{view.duplicateClusters}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-text-title_caps slds-text-color_weak">Auto-merged</div>
                        <div class="slds-text-heading_medium">{view.matchCount}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-text-title_caps slds-text-color_weak">Held for review</div>
                        <div class="slds-text-heading_medium">{view.reviewCount}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-text-title_caps slds-text-color_weak">Apex CPU</div>
                        <div class="slds-text-heading_medium">{view.cpuMillis} ms</div>
                    </div>
                </div>

                <div class={noticeClass}>{footnote}</div>

                <template lwc:if={hasClusters}>
                    <template for:each={view.clusters} for:item="cluster">
                        <div key={cluster.clusterId} class="slds-box slds-box_small slds-var-m-bottom_small">
                            <div class="slds-text-title_bold slds-var-m-bottom_x-small">{cluster.heading}</div>
                            <ul class="slds-var-m-bottom_x-small">
                                <template for:each={cluster.members} for:item="member">
                                    <li key={member.recordId}>
                                        <a href={member.link} target="_blank">{member.name}</a>
                                        <span class="slds-text-color_weak slds-text-body_small">
                                            &nbsp;— {member.detail}
                                        </span>
                                    </li>
                                </template>
                            </ul>
                            <div class="slds-text-title_caps slds-text-color_weak">Why these were merged</div>
                            <template for:each={cluster.evidence} for:item="pair">
                                <div key={pair.key} class="slds-text-body_small slds-var-m-top_xx-small">
                                    <strong>{pair.scoreText}</strong>&nbsp;{pair.headline}
                                    <div class="slds-text-color_weak">{pair.explanation}</div>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>

                <template lwc:else>
                    <div class="slds-text-color_weak slds-var-p-vertical_small">
                        No duplicate clusters found among the contacts scanned.
                    </div>
                </template>

                <template lwc:if={hasReviewQueue}>
                    <h3 class="slds-text-heading_small slds-var-m-vertical_x-small">
                        Held for review — above the review threshold, not merged
                    </h3>
                    <template for:each={view.reviewQueue} for:item="pair">
                        <div key={pair.key} class="slds-box slds-box_xx-small slds-var-m-bottom_xx-small slds-text-body_small">
                            <strong>{pair.scoreText}</strong>&nbsp;
                            <a href={pair.leftLink} target="_blank">{pair.leftName}</a>
                            &nbsp;↔&nbsp;
                            <a href={pair.rightLink} target="_blank">{pair.rightName}</a>
                            <div class="slds-text-color_weak">{pair.explanation}</div>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
