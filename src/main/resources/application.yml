spring:
  application:
    name: coalesce
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# Runs with no external services at all, so the project can be cloned and started in one command.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:coalesce;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${COALESCE_DB_URL:jdbc:postgresql://localhost:5432/coalesce}
    username: ${COALESCE_DB_USER:coalesce}
    password: ${COALESCE_DB_PASSWORD:coalesce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
